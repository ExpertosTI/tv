<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RENACE Pantalla</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/boards.css">
</head>
<body class="tv">
  <section class="gate" id="gate">
    <div class="gate-card">
      <img class="gate-mark" src="/mark.svg" width="72" height="72" alt="">
      <p class="eyebrow">RENACE Pantalla</p>
      <h1 id="title">Escribe este código en el panel</h1>
      <p class="code" id="code" aria-live="polite">------</p>
      <p id="help">Entra al panel del negocio y vincula esta TV.</p>
      <div class="hero-actions" style="justify-content:center">
        <button class="btn primary" type="button" id="new-code">Nuevo código</button>
        <button class="btn" type="button" id="fullscreen">Pantalla completa</button>
      </div>
      <p id="status" role="status"></p>
    </div>
  </section>
  <div class="stage" id="stage" hidden>
    <img id="still" alt="" hidden>
    <video id="clip" playsinline hidden></video>
    <div id="board" hidden></div>
  </div>
  <script src="/boards.js"></script>
  <script src="/tv.js"></script>
</body>
</html>
